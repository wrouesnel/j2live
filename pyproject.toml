[project]
name = "j2live"
version = "0.1.0"
description = "Jinja2 Live Editor"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
# Minimums are the oldest versions packaged on supported distributions
dependencies = [
    "jinja2>=3.0",
    "pygobject>=3.42",
    "ruamel-yaml>=0.17",
]

[project.optional-dependencies]
# Structured log output; plain stdlib logging is used without it
structlog = ["structlog>=21.1"]

[project.scripts]
j2live = "j2live.app:run"

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3,Soup2" } }
